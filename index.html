<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudySnap</title>

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* =========================
           PAGE
        ========================= */

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            color: #234238;

            /* Soft green atmosphere */
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(180, 220, 195, 0.45),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(205, 230, 215, 0.55),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #f3f8f4,
                    #e8f2eb
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;

            overflow-x: hidden;
        }

        /* =========================
           BACKGROUND ATMOSPHERE
        ========================= */

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            width: 420px;
            height: 420px;

            top: -180px;
            right: -120px;

            background: rgba(166, 207, 183, 0.22);

            filter: blur(10px);
        }

        body::after {
            width: 350px;
            height: 350px;

            bottom: -160px;
            left: -100px;

            background: rgba(190, 220, 203, 0.28);

            filter: blur(10px);
        }

        /* =========================
           MAIN APP
        ========================= */

        .app {
            width: 100%;
            max-width: 900px;

            background: rgba(255, 255, 255, 0.78);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.8);

            border-radius: 28px;

            padding: 48px;

            box-shadow:
                0 20px 60px rgba(55, 90, 72, 0.10),
                0 4px 16px rgba(55, 90, 72, 0.06);
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            margin-bottom: 42px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 12px;
        }

        .logo-mark {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: #cfe7d7;

            color: #315c4b;

            font-size: 20px;
            font-weight: 600;
        }

        .logo h1 {
            font-size: 25px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .tagline {
            color: #668077;

            font-size: 15px;
            line-height: 1.6;

            max-width: 600px;
        }

        /* =========================
           QUESTION AREA
        ========================= */

        .question-section {
            margin-bottom: 28px;
        }

        .question-label {
            display: block;

            margin-bottom: 10px;

            font-size: 14px;
            font-weight: 600;

            color: #45675b;
        }

        textarea {
            width: 100%;
            min-height: 180px;

            resize: vertical;

            border: 1px solid #d3e4da;

            border-radius: 18px;

            background: rgba(250, 253, 251, 0.9);

            padding: 20px;

            font-family: inherit;
            font-size: 16px;

            color: #29463c;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        textarea::placeholder {
            color: #9aada5;
        }

        textarea:focus {
            border-color: #9cc7ad;

            background: #ffffff;

            box-shadow:
                0 0 0 4px rgba(156, 199, 173, 0.16);
        }

        /* =========================
           OPTIONS
        ========================= */

        .options {
            display: flex;

            gap: 12px;

            margin-bottom: 28px;

            flex-wrap: wrap;
        }

        .option {
            border: 1px solid #d5e5db;

            background: #f8fbf9;

            color: #557267;

            border-radius: 999px;

            padding: 10px 17px;

            font-size: 14px;

            cursor: pointer;

            transition: all 0.2s ease;
        }

        .option:hover {
            background: #eaf4ed;

            border-color: #b8d4c1;

            transform: translateY(-1px);
        }

        .option.active {
            background: #d5eadc;

            border-color: #a9cdb5;

            color: #315c4b;
        }

        /* =========================
           BUTTON
        ========================= */

        .study-button {
            width: 100%;

            border: none;

            border-radius: 16px;

            padding: 16px 20px;

            background: #78a98b;

            color: white;

            font-family: inherit;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 18px rgba(86, 130, 103, 0.18);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .study-button:hover {
            background: #6c9d7f;

            transform: translateY(-2px);

            box-shadow:
                0 12px 22px rgba(86, 130, 103, 0.22);
        }

        .study-button:active {
            transform: translateY(0);
        }

        /* =========================
           RESULT AREA
        ========================= */

        .result {
            margin-top: 35px;

            padding: 26px;

            border-radius: 20px;

            background: #f2f8f4;

            border: 1px solid #d9e9df;

            display: none;
        }

        .result.visible {
            display: block;
        }

        .result h2 {
            font-size: 19px;

            margin-bottom: 12px;

            color: #315c4b;
        }

        .result p {
            color: #60766d;

            line-height: 1.7;

            font-size: 15px;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 30px;

            text-align: center;

            color: #91a49d;

            font-size: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            body {
                padding: 20px 12px;
            }

            .app {
                padding: 28px 20px;

                border-radius: 22px;
            }

            .header {
                margin-bottom: 30px;
            }

            .logo h1 {
                font-size: 22px;
            }

            textarea {
                min-height: 150px;
            }
        }
    </style>
</head>

<body>

    <main class="app">

        <!-- HEADER -->

        <header class="header">

            <div class="logo">

                <div class="logo-mark">
                    ✦
                </div>

                <h1>StudySnap</h1>

            </div>

            <p class="tagline">
                A calm place to turn a question into something
                you can actually understand.
            </p>

        </header>


        <!-- QUESTION -->

        <section class="question-section">

            <label class="question-label" for="question">
                What are you working on?
            </label>

            <textarea
                id="question"
                placeholder="Paste a question, assignment, or topic here..."
            ></textarea>

        </section>


        <!-- STUDY OPTIONS -->

        <div class="options">

            <button class="option active" type="button">
                Study Guide
            </button>

            <button class="option" type="button">
                Quiz Me
            </button>

            <button class="option" type="button">
                Explain It
            </button>

        </div>


        <!-- MAIN ACTION -->

        <button class="study-button" type="button" onclick="startStudy()">
            Help me study
        </button>


        <!-- RESULT -->

        <section class="result" id="result">

            <h2>Let's work through it.</h2>

            <p id="resultText">
                Your study material will appear here.
            </p>

        </section>


        <!-- FOOTER -->

        <footer class="footer">
            StudySnap · A study companion
        </footer>

    </main>


    <script>

        /* =========================
           OPTION BUTTONS
        ========================= */

        const options = document.querySelectorAll(".option");

        options.forEach(option => {

            option.addEventListener("click", () => {

                options.forEach(button => {
                    button.classList.remove("active");
                });

                option.classList.add("active");

            });

        });


        /* =========================
           TEMPORARY STUDY ACTION
        ========================= */

        function startStudy() {

            const question =
                document.getElementById("question").value.trim();

            const result =
                document.getElementById("result");

            const resultText =
                document.getElementById("resultText");

            if (question === "") {

                resultText.textContent =
                    "Start by adding a question or topic. We'll take it one step at a time.";

            } else {

                resultText.textContent =
                    "Your question has been captured. The next step will turn it into a study guide, quiz, or explanation.";

            }

            result.classList.add("visible");

        }

    </script>

</body>
</html>
