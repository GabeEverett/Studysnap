<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudySnap — Mechanics</title>

    <style>
        /*
         * MECHANICS VERSION
         * No visual atmosphere is being designed here.
         * The goal is clarity and behavior.
         */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;

            background: white;
            color: black;

            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(800px, 100%);
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .description {
            margin-bottom: 35px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 180px;

            padding: 15px;

            border: 1px solid black;

            font-family: inherit;
            font-size: 16px;

            resize: vertical;
        }

        button {
            margin-top: 15px;

            padding: 12px 20px;

            border: 1px solid black;
            background: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #eeeeee;
        }

        #output {
            display: none;

            margin-top: 35px;
            padding-top: 25px;

            border-top: 2px solid black;
        }

        #output.visible {
            display: block;
        }

        #output h2 {
            margin-top: 0;
        }

        .response-section {
            margin-top: 20px;
        }

        .response-section h3 {
            margin-bottom: 8px;
        }

        .response-section p {
            line-height: 1.6;
        }

        .error {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<main>

    <h1>StudySnap</h1>

    <p class="description">
        Enter something you're working on and StudySnap will
        turn it into a simple study response.
    </p>


    <!-- =========================
         INPUT LAYER
    ========================== -->

    <label for="question">
        What are you working on?
    </label>

    <textarea
        id="question"
        placeholder="Type a homework question or topic..."
    ></textarea>

    <button id="helpButton">
        Help me study
    </button>

    <div
        id="error"
        class="error"
    ></div>


    <!-- =========================
         OUTPUT LAYER
    ========================== -->

    <section id="output">

        <h2 id="responseTitle">
            Study Response
        </h2>

        <div class="response-section">

            <h3>
                What to focus on
            </h3>

            <p id="focusText"></p>

        </div>


        <div class="response-section">

            <h3>
                Study approach
            </h3>

            <p id="approachText"></p>

        </div>


        <div class="response-section">

            <h3>
                Check your understanding
            </h3>

            <p id="quizText"></p>

        </div>

    </section>

</main>


<script>

    /*
     * =========================================
     * INPUT LAYER
     * =========================================
     */

    const questionInput =
        document.getElementById("question");

    const helpButton =
        document.getElementById("helpButton");

    const errorMessage =
        document.getElementById("error");


    /*
     * =========================================
     * OUTPUT LAYER
     * =========================================
     */

    const output =
        document.getElementById("output");

    const focusText =
        document.getElementById("focusText");

    const approachText =
        document.getElementById("approachText");

    const quizText =
        document.getElementById("quizText");


    /*
     * =========================================
     * PROCESSING LAYER
     * =========================================
     *
     * This function takes the student's
     * question and decides what type of
     * response should be generated.
     */

    function processQuestion(question) {

        const lowerQuestion =
            question.toLowerCase();


        /*
         * Math detection
         */

        if (
            lowerQuestion.includes("solve") ||
            lowerQuestion.includes("equation") ||
            lowerQuestion.includes("calculate") ||
            lowerQuestion.includes("math")
        ) {

            return {
                focus:
                    "Identify the numbers, variables, and information the problem gives you before trying to solve it.",

                approach:
                    "Break the problem into smaller steps. Write down what you know, identify what you need to find, and choose the rule or formula that connects them.",

                quiz:
                    "Without looking at your notes, explain what the first step would be and why."
            };

        }


        /*
         * Science detection
         */

        if (
            lowerQuestion.includes("biology") ||
            lowerQuestion.includes("science") ||
            lowerQuestion.includes("cell") ||
            lowerQuestion.includes("organism") ||
            lowerQuestion.includes("experiment")
        ) {

            return {
                focus:
                    "Identify the main concept, the important terms, and how they relate to each other.",

                approach:
                    "Start by defining the key idea in your own words. Then connect it to an example or process that demonstrates how it works.",

                quiz:
                    "Explain the main concept without looking at your notes. Then give one example."
            };

        }


        /*
         * History detection
         */

        if (
            lowerQuestion.includes("history") ||
            lowerQuestion.includes("war") ||
            lowerQuestion.includes("revolution") ||
            lowerQuestion.includes("empire") ||
            lowerQuestion.includes("historical")
        ) {

            return {
                focus:
                    "Focus on the people, events, causes, effects, and time period involved.",

                approach:
                    "Put the major events into chronological order and identify how one event influenced the next.",

                quiz:
                    "What was one major cause of the event, and what happened as a result?"
            };

        }


        /*
         * General response
         */

        return {
            focus:
                "Identify the main question, the important terms, and what you already understand.",

            approach:
                "Break the assignment into smaller pieces. Explain the main idea in your own words before trying to memorize details.",

            quiz:
                "Close your notes and explain the main idea in your own words."
        };

    }


    /*
     * =========================================
     * MAIN INTERACTION
     * =========================================
     */

    helpButton.addEventListener(
        "click",
        function() {

            const question =
                questionInput.value.trim();


            /*
             * Reset previous error.
             */

            errorMessage.textContent = "";


            /*
             * Validate the input.
             */

            if (question === "") {

                errorMessage.textContent =
                    "Enter a question or topic first.";

                questionInput.focus();

                return;
            }


            /*
             * Send the input through
             * the processing layer.
             */

            const result =
                processQuestion(question);


            /*
             * Send the processed information
             * to the output layer.
             */

            focusText.textContent =
                result.focus;

            approachText.textContent =
                result.approach;

            quizText.textContent =
                result.quiz;


            /*
             * Display the output.
             */

            output.classList.add("visible");


            /*
             * Move the user to the response.
             */

            output.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        }
    );

</script>

</body>
</html>
